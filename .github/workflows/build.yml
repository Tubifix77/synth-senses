name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The wrapper JAR isn't committed, so provision Gradle directly.
      - name: Set up Gradle
        # v6, but with the open-source cache implementation. v6 moved caching
        # into gradle-actions-caching, a proprietary component whose default
        # ('enhanced') means accepting Gradle's commercial Terms of Use.
        # 'basic' is the open-source path over the GitHub Actions cache, so
        # this repo gets the maintained action and the Node 24 runtime without
        # taking on those terms. Use cache-disabled: true if you want no doubt
        # at all.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      # yamnet.tflite is deliberately absent — AudioSensor degrades at runtime,
      # so its absence must not break the build. This job proves that.
      - name: Assemble
        run: gradle --no-daemon assembleDebug

      # The APK had been opened by hand once and the findings written into
      # docs/VALIDATION.md. A one-off check decays: lowering minSdk to 28
      # made that table stale the same evening it was written. This reads the
      # binary manifest out of the artifact that was actually built -- no
      # aapt, no Android SDK, pure stdlib -- so the claims cannot drift from
      # the build again.
      # TEMPORARY: mint a debug keystore once so it can be committed.
      # Every CI runner is ephemeral, so Gradle generates a fresh default
      # debug key per build, every APK is signed with a different key, and
      # Android refuses to update an app whose signature changed -- which
      # forces an uninstall on every single update and takes the user's
      # settings, learned places and the sound model with it. A committed
      # debug keystore fixes that. It is not a secret: the password is
      # `android` and Google publishes it. This step is removed once the
      # keystore is in the repo.
      - name: Mint a debug keystore
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android -keypass android             -alias androiddebugkey             -keyalg RSA -keysize 2048 -validity 10950             -dname "CN=Android Debug,O=Android,C=US"
          ls -la debug.keystore

      - uses: actions/upload-artifact@v7
        with:
          name: debug-keystore
          path: debug.keystore

      - name: Read the facts out of the APK
        run: |
          python3 tools/apk_facts.py app/build/outputs/apk/debug/app-debug.apk             --expect-min-sdk 28             --expect-target-sdk 36             --expect-compile-sdk 37             --forbid assets/README.md             --forbid assets/yamnet.tflite

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: synth-senses-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: android lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'
      - run: gradle --no-daemon lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      # Exercises Habituation, PlaceMemory and TempoSensor for real. These were
      # previously only validated via Python models of the algorithms.
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  emulator:
    name: emulator smoke test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the real range, because the app is developed for two
        # phones at once: a Huawei P20 Lite on Android 9 and a Xiaomi 14T Pro
        # on Android 14.
        #
        # 28 is minSdk. Until this entry existed the floor was compiled and
        # never once started, which is the same "green because nothing ran"
        # trap as an empty test suite.
        #
        # 36 is targetSdk, and that is the reason for it rather than 35:
        # compileSdk decides what the app is built against, targetSdk decides
        # how Android treats it at runtime, and runtime behaviour is the only
        # thing an emulator can actually test. 36 is also the newest stable
        # google_apis x86_64 image Google publishes -- checked against
        # dl.google.com's own sys-img manifest, where 37 exists only on the
        # canary channel.
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      # The emulator needs hardware acceleration to be anything other than
      # unusable, and the runner exposes KVM only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Twice in two days a runner has handed back a corrupt SDK archive --
      # "Error on ZipFile unknown archive", once for the emulator package and
      # once for the system image -- and both times the job died minutes later
      # with a baffling "could not connect to TCP port 5554". sdkmanager
      # reports that corruption as a *warning* and still exits 0, so nothing
      # downstream notices until the emulator that was never installed fails to
      # start.
      #
      # So install both here instead, retrying, and verify the files actually
      # landed rather than trusting the exit code.
      #
      # This step is hardening, never a new way to fail: if it cannot find
      # sdkmanager it says so and stands aside, because the emulator action
      # installs everything itself regardless. The first version of this did
      # fail the job -- `sdkmanager` is not on PATH until the action puts it
      # there, so all three attempts died on "command not found" and took both
      # matrix legs with them. A guard against flakiness that is itself a
      # single point of failure is worse than no guard.
      - name: Install the emulator and system image, with retries
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkm" ]; then
            sdkm="$(find "$sdk/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ ! -x "$sdkm" ]; then
            echo "::warning::no sdkmanager under $sdk — leaving the install to the action"
            exit 0
          fi
          echo "using $sdkm"
          img="system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          dir="$sdk/system-images/android-${{ matrix.api-level }}/google_apis/x86_64"
          yes | "$sdkm" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3; do
            "$sdkm" --install emulator "$img" > /dev/null || true
            if [ -x "$sdk/emulator/emulator" ] && [ -d "$dir" ]; then
              echo "emulator and $img present (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt left something missing; retrying"
            rm -rf "$sdk/.downloadIntermediates" || true
            sleep $((attempt * 20))
          done
          echo "::warning::could not pre-install after 3 attempts — letting the action try"
          exit 0

      - name: Instrumented tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -camera-back emulated -camera-front emulated
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      # The interesting failures here are logged rather than thrown, so keep
      # the report whatever happened.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-test-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  tools:
    name: receiver smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python3 -m py_compile tools/receiver.py tools/test_receiver_ws.py tools/transitive_sweep.py tools/digest.py tools/test_digest.py tools/test_docs.py tools/potluck_bridge.py tools/test_potluck_bridge.py tools/apk_facts.py

      # The WebSocket is the primary transport and was the one path nothing
      # exercised automatically. Speaks RFC 6455 at the receiver as a real
      # client would: masked frames, a fragmented message, a ping, a close.
      - name: WebSocket protocol test
        run: python3 tools/test_receiver_ws.py

      # The dependency tool is what bumps get decided on, and its version
      # ordering follows Gradle's rules rather than string order. A regression
      # there would not crash, it would quietly give a wrong answer.
      - name: Dependency tool tests
        run: python3 tools/test_transitive_sweep.py

      # The digest redacts OCR text and transcripts by default. That is a
      # privacy control rather than a formatting choice, so it is tested.
      - name: Digest tests
        run: python3 tools/test_digest.py

      # docs/INTEGRATION.md is written to be coded against without reading the
      # Kotlin, so a stale number in it is worse than no document.
      - name: Documentation matches the source
        run: python3 tools/test_docs.py

      # The Potluck bridge turns percepts into ten numbers for another
      # project's cell. Its ordinals are that project's wire format, its
      # write budget is someone else's rate limit, and absence must stay
      # absence rather than becoming a confident zero -- none of which fails
      # loudly if it breaks.
      - name: Potluck bridge tests
        run: python3 tools/test_potluck_bridge.py

      - name: POST a percept and check it is accepted
        run: |
          python3 tools/receiver.py --port 8077 --log /tmp/p.jsonl --no-console &
          sleep 2
          cat > /tmp/percept.json <<'JSON'
          {"schema":2,"device_id":"ci","seq":1,"ts":"2026-01-01T00:00:00.000Z",
           "trigger":"first",
           "attention":{"salience":1.0,"novel":["v:Room"],"known_tokens":1,
                        "dishabituated":false,"floor_reason":null},
           "vision":null,"hearing":null,"radio":null,
           "body":{"motion":"still","posture":"face_up","accel_rms":0.0,"gyro_rms":0.0,
                   "heading_deg":null,"steps":null,"steps_delta":null,"lux":null,
                   "covered":null,"magnetic_ut":null,"magnetic_anomaly":null,
                   "pressure_hpa":null,"pressure_delta_per_min":null},
           "self":{"battery":1.0,"charging":true,"battery_temp_c":null,"current_ma":null,
                   "voltage_v":null,"thermal":"NONE","thermal_headroom":null,
                   "mem_free_pct":0.5,"mem_low":false,"storage_free_pct":null,
                   "screen_on":false,"net":"wifi","uptime_s":1},
           "tempo":{"local_time":"00:00","tz_offset_min":0,"day_of_week":"Thursday",
                    "part_of_day":"deep night","solar_elevation_deg":null,
                    "is_daylight":null,"minutes_to_sunset":null,
                    "minutes_since_sunrise":null,"day_length_min":null},
           "gps":null,"narration":"CI percept."}
          JSON
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data @/tmp/percept.json http://127.0.0.1:8077/percept)
          echo "HTTP $code / $(cat /tmp/resp.json)"
          test "$code" = "200"
          grep -q '"accepted": 1' /tmp/resp.json
          test -s /tmp/p.jsonl
