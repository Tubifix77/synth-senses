version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      androidx:
        patterns: ["androidx.*"]
      google-ml:
        patterns: ["com.google.mlkit:*", "com.google.mediapipe:*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
